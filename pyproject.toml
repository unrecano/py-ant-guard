[project]
name = "ant-guard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "motor>=3.7.1",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "streamlit>=1.56.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
    "testcontainers>=4.14.2",
    "ty>=0.0.32",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]

[tool.ty.environment]
extra-paths = ["src"]
